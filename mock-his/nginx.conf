# Mock HIS for the docker compose demo. Speaks the same API as the real one:
#   GET /{hospital}/patient/search/{id}  -> data/{hospital}/{id}.json, or 404
server {
    listen 80;
    root /data;
    default_type application/json;

    # demo: this id makes Hospital A's HIS fail, to show the 502 path
    location = /hospital-a/patient/search/0000000000000 {
        return 503 '{"error":"maintenance"}';
    }

    location ~ ^/(hospital-[a-z]+)/patient/search/([A-Za-z0-9]+)$ {
        if ($request_method != GET) {
            return 405;
        }
        try_files /$1/$2.json =404;
    }

    location / {
        return 404 '{"error":"not found"}';
    }
}
